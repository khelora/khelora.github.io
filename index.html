<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khelora</title>
<style>
  :root { --bg: #070d1f; --panel: #0d1733; --line: #22386b; --text: #dbe6ff; --muted: #9fb2d9; --accent: #43d8ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 780px; margin: 0 auto; padding: 56px 16px; }
  h1 { font-size: 40px; margin: 0; color: #fff; letter-spacing: 1px; }
  .muted { color: var(--muted); }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 28px 0; }
  h2 { font-size: 19px; margin: 0 0 8px; color: var(--accent); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Khelora</h1>
  <p class="muted">Simple, fun mobile games.</p>

  <div class="box">
    <h2>Our games</h2>
    <p>Split Ball: Space</p>
  </div>

  <p><a href="privacy-policy.html">Privacy Policy</a> &middot;
  <a href="mailto:abdur.dev89@gmail.com">abdur.dev89@gmail.com</a></p>
</main>
</body>
</html>
