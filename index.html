<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khelora</title>
<meta name="description" content="Khelora makes simple, fun mobile games.">
<meta property="og:title" content="Khelora">
<meta property="og:description" content="Simple, fun mobile games.">
<meta property="og:image" content="https://khelora.github.io/header.jpg">
<link rel="icon" type="image/png" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #ffffff; --ink: #222222; --muted: #6b6b6b; --line: #ececec; --soft: #f6f6f6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  header { padding: 96px 0 56px; text-align: center; }
  header img { width: min(340px, 78vw); height: auto; }
  .tag { color: var(--muted); font-size: 20px; margin: 22px 0 0; }
  h2 { font-size: 13px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: var(--muted); margin: 0 0 16px; }
  .game { display: flex; align-items: center; gap: 18px; padding: 18px; border: 1px solid var(--line); border-radius: 20px; background: var(--soft); }
  .game img { width: 84px; height: 84px; border-radius: 20px; flex: none; }
  .game h3 { margin: 0; font-size: 20px; font-weight: 800; }
  .game p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  .contact { margin-top: 56px; text-align: center; }
  .contact p { margin: 0 0 18px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .links a { display: inline-flex; align-items: center; gap: 9px; padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); text-decoration: none; font-weight: 600; font-size: 15px; }
  .links a:hover { border-color: var(--ink); }
  .links svg { width: 18px; height: 18px; flex: none; }
  footer { margin: 72px 0 40px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: center; font-size: 15px; color: var(--muted); }
  a { color: var(--ink); text-decoration-color: #bbb; text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.png" alt="khelora" width="520" height="125">
    <p class="tag">Simple, fun mobile games.</p>
  </header>

  <section>
    <h2>Our games</h2>
    <div class="game">

      <div>

    </div>
